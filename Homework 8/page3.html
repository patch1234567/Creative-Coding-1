		<body>
		
			
			<script>
				function checkboxes()
				{
				
					var firstName = document.getElementById("fName").value;
					var lastName = document.getElementById("lName").value;
					var email = document.getElementById("userEmail").value;
					var termsOfService = document.getElementById("termsOfServiceCheckBox").value;
					
					if(termsOfServiceCheckBox.checked == false)
					{
						document.getElementById("termsOfServiceCheckBox").focus();
						window.alert("You must agree to the terms of service before submitting.")
						
						
					}
					if(email == "")
					{
					
						document.getElementById("userEmail").style.backgroundColor = "red";
						document.getElementById("userEmail").focus();
					}
					
					if(lastName == "")
					{
						document.getElementById("lName").style.backgroundColor = "red";
						document.getElementById("lName").focus();
					}
					
					if(firstName == "")
					{
						document.getElementById("fName").style.backgroundColor = "red";
						document.getElementById("fName").focus();
					}
				}
			</script>
			
			<h1>
				<span style="font-style: italic;">
				Contact us:</span>
			</h1>
			
			<form action="" type="POST">
				First name: <input type="text" id="fName"><br>
				Last name: <input type="text" id="lName"><br>
				Email: <input type="text" id="userEmail"><br>
				
				<input type="checkbox" id="termsOfServiceCheckBox">
				By clicking this box you to our <a href="termsOfService.html"><span class="pageLink"><span id = "termsOfServicePageLink">terms of service.</span></span></a><br>
				
				<button type="button" id="btnSubmit" class="btn btn-primary" onclick='checkboxes();'>Submit</button>
